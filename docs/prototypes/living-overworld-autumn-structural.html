<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Overworld autumn structural proof</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e8f2df; color: #fffdf0; font-family: Arial, sans-serif; }
    .scene { position: relative; height: 300px; overflow: hidden; isolation: isolate; background: linear-gradient(#7890aa 0%, #d79b7a 55%, #f3ca84 100%); border-bottom: 7px solid #507f37; box-shadow: 0 5px #705238; }
    .sky-glow { position: absolute; inset: 0; background: radial-gradient(circle at 51% 30%, rgba(255,237,178,.3), transparent 24%); }
    .sun { position: absolute; z-index: 1; left: 50%; top: 34px; translate: -50%; width: 55px; aspect-ratio: 1; background: #ffe28a; border: 6px solid #ffc65a; box-shadow: 0 0 35px rgba(255,225,134,.65); }
    .mountains { position: absolute; z-index: 2; bottom: 0; width: 900px; height: auto; opacity: .72; filter: saturate(.68) brightness(.88); }
    .mountains.center { left: 50%; translate: -50%; }
    .mountains.outer { display: none; width: 760px; opacity: .32; bottom: -18px; }
    .mountains.outer-left { left: -170px; transform: scaleX(-1); }
    .mountains.outer-right { right: -210px; }
    .ground-band { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(#8f682d 0 20%, #76502c 21% 35%, #513820 36%); }
    .water-system { position: absolute; z-index: 4; left: calc(50% - 520px); bottom: 0; width: 760px; aspect-ratio: 3 / 1; }
    .water-system img, .house, .ground { position: absolute; width: 100%; height: 100%; object-fit: contain; }
    .water-system .outcrop { z-index: 1; }
    .water-system .water { z-index: 2; }
    .ground { z-index: 6; left: 50%; bottom: -20px; translate: -50%; width: min(1100px, 100vw); height: auto; }
    .meadow { position: absolute; z-index: 5; bottom: -20px; width: 1100px; height: auto; }
    .meadow.left { right: calc(50% + 500px); }
    .meadow.right { left: calc(50% + 500px); transform: scaleX(-1); }
    .house { z-index: 7; right: calc(50% - 560px); bottom: -20px; width: 760px; height: auto; }
    .object-stage { position: absolute; z-index: 8; inset-block: 0; left: 50%; width: min(1100px, 100vw); translate: -50%; pointer-events: none; }
    .object { position: absolute; bottom: 15px; left: var(--x); height: var(--h); width: auto; translate: -50%; filter: drop-shadow(0 4px 3px rgba(20,34,22,.2)); }
    .header { position: absolute; z-index: 20; inset: 0 0 auto; min-height: 86px; padding: 12px max(18px, calc((100vw - 1280px) / 2)); background: linear-gradient(180deg, rgba(9,29,27,.82), rgba(9,29,27,.4) 70%, transparent); text-shadow: 2px 2px rgba(12,26,20,.55); }
    .header-main, .header-status { display: flex; align-items: center; gap: 10px; }
    .brand { font-family: Georgia, serif; font-size: 21px; font-weight: 700; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 10px; }
    .control { padding: 7px 9px; border: 2px solid #a7d678; background: rgba(38,78,47,.78); color: inherit; font-weight: 700; }
    .header-status { margin-top: 7px; font-size: 10px; }
    .header-status .motion { margin-left: auto; }
    main { max-width: 1220px; margin: 28px auto; padding: 28px; color: #1a372d; background: #fffdf3; border: 3px solid #65513a; border-top: 9px solid #659f43; box-shadow: 7px 7px rgba(38,56,35,.25); }
    main small { color: #16836c; letter-spacing: .14em; text-transform: uppercase; }
    main h1 { margin: 8px 0 3px; font-family: Georgia, serif; font-size: 40px; }
    main p { margin: 0; color: #58665f; }
    @media (max-width: 700px) {
      .scene { height: 170px; }
      .sun { top: 38px; width: 40px; border-width: 4px; }
      .mountains.center { width: 420px; bottom: 0; }
      .mountains.outer, .meadow { display: none; }
      .water-system { left: -2px; bottom: 4px; width: 380px; }
      .ground { width: 430px; bottom: -5px; }
      .house { right: -8px; bottom: -2px; width: 360px; }
      .ground-band { height: 20px; }
      .object-stage { width: 420px; }
      .object { height: calc(var(--h) * .62); bottom: 6px; }
      .header { min-height: 70px; padding: 9px 10px; }
      .brand { font-size: 17px; }
      .header-actions { gap: 5px; }
      .header-actions span:first-child { display: none; }
      .control { padding: 6px; font-size: 9px; }
      .header-status { margin-top: 5px; font-size: 9px; }
      .header-status span:nth-child(2), .header-status span:nth-child(3) { display: none; }
      main { margin: 18px 10px; padding: 20px; }
      main h1 { font-size: 29px; }
    }
    @media (min-width: 1500px) { .mountains.outer { display: block; } }
  </style>
</head>
<body>
  <section class="scene" aria-label="Autumn structural landscape proof">
    <div class="sky-glow"></div><div class="sun"></div>
    <img class="mountains outer outer-left" src="../../public/assets/living-overworld/autumn-modular/distant-a.png" alt="">
    <img class="mountains center" src="../../public/assets/living-overworld/autumn-structural/mountains.png" alt="">
    <img class="mountains outer outer-right" src="../../public/assets/living-overworld/autumn-modular/distant-b.png" alt="">
    <div class="ground-band"></div>
    <div class="water-system">
      <img class="outcrop" src="../../public/assets/living-overworld/autumn-structural/waterfall-outcrop.png" alt="">
      <img class="water" src="../../public/assets/living-overworld/autumn-structural/water-connected.png" alt="">
    </div>
    <img class="meadow left" src="../../public/assets/living-overworld/autumn-structural/meadow-extension.png" alt="">
    <img class="meadow right" src="../../public/assets/living-overworld/autumn-structural/meadow-extension.png" alt="">
    <img class="ground" src="../../public/assets/living-overworld/autumn-structural/ground.png" alt="">
    <img class="house" src="../../public/assets/living-overworld/retreat.png" alt="">
    <div class="object-stage">
      <img class="object" style="--x:8%;--h:72px" src="../../public/assets/living-overworld/autumn-modular/objects/tree.png" alt="">
      <img class="object" style="--x:31%;--h:34px" src="../../public/assets/living-overworld/autumn-modular/objects/bush.png" alt="">
      <img class="object" style="--x:47%;--h:28px" src="../../public/assets/living-overworld/autumn-modular/objects/grass.png" alt="">
      <img class="object" style="--x:68%;--h:25px" src="../../public/assets/living-overworld/autumn-modular/objects/flowers.png" alt="">
      <img class="object" style="--x:84%;--h:31px" src="../../public/assets/living-overworld/autumn-modular/objects/rock.png" alt="">
    </div>
    <header class="header">
      <div class="header-main"><span class="brand">Sensei</span><div class="header-actions"><span>Theme</span><span class="control">Living Overworld</span><span class="control">Parent Mode</span></div></div>
      <div class="header-status"><strong>Autumn · Day</strong><span>Clear · 13°C</span><span>Weather by Open-Meteo</span><button class="control motion" type="button">Pause motion</button></div>
    </header>
  </section>
  <main><small>This week</small><h1>Autumn structural recomposition</h1><p>Independent mountains, cliff, connected water, house, ground, and vegetation.</p></main>
</body>
</html>
