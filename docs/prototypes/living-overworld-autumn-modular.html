<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Overworld autumn modular proof</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #e8f2df; color: #fffdf0; font-family: Arial, sans-serif; }
    .scene {
      --core: clamp(840px, 48vw, 940px);
      --world-top: 38px;
      --overlap: 70px;
      position: relative;
      height: 280px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 26%, rgba(242, 221, 174, .26), transparent 22%),
        linear-gradient(180deg, #68789a 0%, #ad7a72 44%, #e1a56c 72%, #efd49a 100%);
      border-bottom: 7px solid #507f37;
      box-shadow: 0 5px #705238;
      isolation: isolate;
    }
    .stars { position: absolute; inset: 0; z-index: 0; opacity: .28; background: radial-gradient(circle at 14% 18%, white 0 1px, transparent 2px) 0 0 / 173px 111px; }
    .moon { position: absolute; z-index: 1; top: 31px; left: 50%; width: 72px; aspect-ratio: 1; translate: -50% 0; border-radius: 50%; background: url('../../public/assets/living-overworld/moon-detailed.png') center / contain no-repeat; filter: drop-shadow(0 0 22px rgba(203,225,255,.55)); }
    .segment, .core { position: absolute; top: var(--world-top); left: 50%; z-index: 3; width: var(--core); aspect-ratio: 3 / 1; pointer-events: none; }
    .segment img, .core img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .distant { z-index: 2; opacity: .75; filter: brightness(.8) saturate(.76); }
    .distant.left-far { top: 61px; opacity: .48; }
    .distant.left-far img { transform: scaleX(-1) scale(.84); transform-origin: right bottom; }
    .distant.right-near img { transform: scaleX(-1); }
    .distant.right-far { top: 53px; opacity: .54; }
    .distant.right-far img { transform: scale(.88); transform-origin: left bottom; }
    .left-far { transform: translateX(calc(-250% + 140px)); }
    .left-near { transform: translateX(calc(-150% + var(--overlap))); }
    .core { transform: translateX(-50%); }
    .right-near { transform: translateX(calc(50% - var(--overlap))); }
    .right-far { transform: translateX(calc(150% - 140px)); }
    .terrain { z-index: 4; }
    .mountains { z-index: 3; }
    .core-terrain { z-index: 5; }
    .water { z-index: 6; }
    .retreat { z-index: 7; }
    .foreground { z-index: 10; }
    .object { position: absolute; z-index: 9; bottom: 5px; left: var(--x); height: var(--h); width: auto; translate: -50% 0; pointer-events: none; }
    .lighting { position: absolute; inset: 0; z-index: 12; pointer-events: none; background: linear-gradient(180deg, rgba(17,24,52,.15), rgba(79,35,24,.16)); mix-blend-mode: multiply; }
    .header { position: absolute; z-index: 20; inset: 0 0 auto; min-height: 82px; padding: 12px max(18px, calc((100vw - 1280px) / 2)); background: linear-gradient(180deg, rgba(9,29,27,.82), rgba(9,29,27,.44) 68%, transparent); text-shadow: 2px 2px rgba(12,26,20,.55); }
    .header-main, .header-status { display: flex; align-items: center; gap: 10px; }
    .brand { font-family: Georgia, serif; font-size: 21px; font-weight: 700; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 10px; }
    .control { padding: 7px 9px; border: 2px solid #a7d678; background: rgba(38,78,47,.78); font-weight: 700; }
    .header-status { margin-top: 7px; font-size: 10px; }
    .header-status .motion { margin-left: auto; }
    main { max-width: 1220px; margin: 28px auto; padding: 28px; color: #1a372d; background: #fffdf3; border: 3px solid #65513a; border-top: 9px solid #659f43; box-shadow: 7px 7px rgba(38,56,35,.25); }
    main small { color: #16836c; letter-spacing: .14em; text-transform: uppercase; }
    main h1 { margin: 8px 0 3px; font-family: Georgia, serif; font-size: 40px; }
    main p { margin: 0; color: #58665f; }
    @media (max-width: 700px) {
      .scene { --core: 110vw; --world-top: 25px; height: 165px; }
      .segment { display: none; }
      .moon { top: 38px; width: 48px; }
      .header { min-height: 70px; padding: 9px 10px; }
      .brand { font-size: 17px; }
      .header-actions { gap: 5px; }
      .header-actions span:first-child { display: none; }
      .control { padding: 6px; font-size: 9px; }
      .header-status { margin-top: 5px; font-size: 9px; }
      .header-status span:nth-child(2), .header-status span:nth-child(3) { display: none; }
      .object { height: calc(var(--h) * .78); }
      main { margin: 18px 10px; padding: 20px; }
      main h1 { font-size: 29px; }
    }
  </style>
</head>
<body>
  <section class="scene" aria-label="Autumn modular world composition proof">
    <div class="stars"></div>
    <div class="moon"></div>

    <div class="segment distant left-far"><img src="../../public/assets/living-overworld/autumn-modular/distant-b.png" alt=""></div>
    <div class="segment distant left-near"><img src="../../public/assets/living-overworld/autumn-modular/distant-a.png" alt=""></div>
    <div class="segment distant right-near"><img src="../../public/assets/living-overworld/autumn-modular/distant-b.png" alt=""></div>
    <div class="segment distant right-far"><img src="../../public/assets/living-overworld/autumn-modular/distant-a.png" alt=""></div>

    <div class="segment terrain left-far"><img src="../../public/assets/living-overworld/autumn-modular/terrain-right.png" alt=""></div>
    <div class="segment terrain left-near"><img src="../../public/assets/living-overworld/autumn-modular/terrain-left.png" alt=""></div>
    <div class="segment terrain right-near"><img src="../../public/assets/living-overworld/autumn-modular/terrain-right.png" alt=""></div>
    <div class="segment terrain right-far"><img src="../../public/assets/living-overworld/autumn-modular/terrain-left.png" alt=""></div>

    <div class="core mountains"><img src="../../public/assets/living-overworld/distant-mountains-v2.png" alt=""></div>
    <div class="core core-terrain"><img src="../../public/assets/living-overworld/seasons/autumn/terrain.png" alt=""></div>
    <div class="core water"><img src="../../public/assets/living-overworld/water.png" alt=""></div>
    <div class="core retreat"><img src="../../public/assets/living-overworld/retreat.png" alt=""></div>
    <img id="proof-tree" class="object" data-world-object="autumn-tree-left" style="--x:6%;--h:84px" src="../../public/assets/living-overworld/autumn-modular/objects/tree.png" alt="">
    <img class="object" data-world-object="autumn-bush-left" style="--x:27%;--h:39px" src="../../public/assets/living-overworld/autumn-modular/objects/bush.png" alt="">
    <img class="object" data-world-object="autumn-grass-center" style="--x:42%;--h:34px" src="../../public/assets/living-overworld/autumn-modular/objects/grass.png" alt="">
    <img class="object" data-world-object="autumn-flowers-center" style="--x:62%;--h:28px" src="../../public/assets/living-overworld/autumn-modular/objects/flowers.png" alt="">
    <img class="object" data-world-object="autumn-rock-right" style="--x:79%;--h:34px" src="../../public/assets/living-overworld/autumn-modular/objects/rock.png" alt="">
    <div class="core foreground"><img src="../../public/assets/living-overworld/seasons/autumn/foreground-vegetation.png" alt=""></div>

    <div class="lighting"></div>
    <header class="header">
      <div class="header-main"><span class="brand">Sensei</span><div class="header-actions"><span>Theme</span><span class="control">Living Overworld</span><span class="control">Parent Mode</span></div></div>
      <div class="header-status"><strong>Autumn · Evening</strong><span>Cloudy · 13°C</span><span>Weather by Open-Meteo</span><button id="swap-tree" class="control motion" type="button">Swap tree</button></div>
    </header>
  </section>
  <main><small>This week</small><h1>Autumn modular composition proof</h1><p>Isolated synthetic evidence. No household data is used.</p></main>
  <script>
    const tree = document.getElementById('proof-tree');
    const button = document.getElementById('swap-tree');
    const amber = '../../public/assets/living-overworld/autumn-modular/objects/tree.png';
    const red = '../../public/assets/living-overworld/autumn-modular/objects/tree-red.png';
    button.addEventListener('click', () => {
      const useRed = tree.getAttribute('src') === amber;
      tree.setAttribute('src', useRed ? red : amber);
      button.textContent = useRed ? 'Restore tree' : 'Swap tree';
    });
  </script>
</body>
</html>
