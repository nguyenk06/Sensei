<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Living Overworld waterfall assembly proof</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #181818; }
    .proof {
      position: relative;
      width: 1676px;
      height: 593px;
      overflow: hidden;
      background-color: #242424;
      background-image:
        linear-gradient(45deg, #303030 25%, transparent 25%),
        linear-gradient(-45deg, #303030 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #303030 75%),
        linear-gradient(-45deg, transparent 75%, #303030 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    .assembly {
      position: absolute;
      left: 68px;
      top: 102px;
      width: 1130px;
      aspect-ratio: 2172 / 724;
    }
    .assembly img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .outcrop { z-index: 1; }
    .outcrop.left { transform: translateX(-18%) scaleX(-1); }
    .outcrop.right { transform: translateX(18%); }
    .water { z-index: 2; transform: translate(42%, 5%); }
  </style>
</head>
<body>
  <main class="proof" aria-label="Isolated three-asset waterfall assembly proof">
    <div class="assembly" data-assets="two-outcrops-one-waterfall">
      <img class="outcrop left" src="../../public/assets/living-overworld/autumn-structural/waterfall-outcrop.png" alt="">
      <img class="outcrop right" src="../../public/assets/living-overworld/autumn-structural/waterfall-outcrop.png" alt="">
      <img class="water" src="../../public/assets/living-overworld/autumn-structural/water-connected.png" alt="">
    </div>
  </main>
</body>
</html>
